name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: 格式与 Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 集成测试会真的拉起守护进程并写数据文件，必须指向临时目录，
      # 否则会污染 runner 上的 ~/.gld，多个 job 之间还会互相干扰。
      - name: cargo test
        run: |
          export GLD_HOME="$(mktemp -d)"
          cargo test --workspace --all-targets --locked

  docs:
    name: 命令参考是否最新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # 改了 cli.rs 里的帮助文本却忘了重新生成 docs/cli.md 时，在这里拦住。
      - name: 重新生成并比对
        run: |
          scripts/gen-cli-docs.sh
          git diff --exit-code docs/cli.md \
            || { echo "::error::docs/cli.md 与 --help 不一致，请运行 scripts/gen-cli-docs.sh 后提交"; exit 1; }

  windows:
    name: Windows 编译检查与补丁落盘测试
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Windows 上守护进程走命名管道，与 Unix domain socket 是两套实现，
      # 至少要保证它能编过；运行时行为由使用者反馈补充。
      - run: cargo check --workspace --all-targets --locked
      # 补丁落盘这一块在 Windows 上真跑一遍。为什么单挑它：`toexec_fs::replace`
      # 在那里的语义和 Unix 不一样（替换不了只读目标、目标被独占打开时失败），
      # 而 gld 有 Windows 发布构建。跨仓评审 X01 修的正是这条路径上会丢文件的
      # 老实现——它先 remove_file 再 rename，后一步失败旧文件就没了。
      #
      # 为什么不是 --workspace：守护进程、命名管道、进程树那些都还没在 Windows
      # 上验过，一次全开只会得到一片红，分不出哪些是真问题。要扩就一块一块加。
      - name: 补丁落盘测试
        run: |
          export GLD_HOME="$(mktemp -d)"
          if cargo test -p gld-core --lib tools::patch --locked 2>&1 | tee test.log; then
            exit 0
          fi
          # 完整日志要登录 GitHub 才看得到（仓库公开也一样），annotation 匿名
          # 读得到。不塞这一段，外面只能看到 "exit code 101"。%0A 是换行转义。
          msg=$(grep -E -A 3 "panicked at|^failures:|FAILED" test.log | head -40 | awk '{printf "%s%%0A", $0}')
          echo "::error title=Windows 上的补丁落盘测试失败::$msg"
          exit 1

  msrv:
    name: MSRV 编译检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三个平台都要：core/src/platform 下 linux、macos、windows 各一套实现，
        # 只在自己的 OS 上编译；Windows 还多一个 windows crate，Unix 多一个
        # libc。只查一个平台的话，另外两套用了新 API 也发现不了。
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # 警告归上面 stable 的 Clippy 和 Windows 编译检查管。这里只回答"声明的
      # 版本编不编得过"，老编译器才有的警告（比如不认识后来新加的 lint 名）
      # 不该拦住合并。
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # 版本只写在 Cargo.toml 一处：三仓以后一起升 rust-version 时这里不用
      # 跟着改，也就不会还在测旧版本。
      - name: 读 Cargo.toml 里的 rust-version
        id: msrv
        shell: bash
        run: |
          v=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          case "$v" in
            ''|*[!0-9.]*)
              echo "::error::根 Cargo.toml 要有且只有一行 rust-version = \"x.y\"，实际读到：$v"
              exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # toexec 是 https 的 git 依赖，公开仓库，匿名就能拉。
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked
