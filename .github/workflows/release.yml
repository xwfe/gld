name: Release

# 打 v 开头的 tag 就发版；也可以手动触发，只产出构件不建 Release，
# 用来在真发版之前先确认流水线是通的。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # tag 不会触发 ci.yml（它只盯 main 和 PR），所以发版前在这儿再跑一遍测试。
  # 没测过的东西不往外发。
  test:
    name: 发版前测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          export GLD_HOME="$(mktemp -d)"
          cargo test --workspace --all-targets --locked

  build:
    name: 构建 ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    # optional 的目标编不过不影响发版，其余目标必须全绿。
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # ubuntu-22.04 的 glibc 是 2.35，覆盖 Ubuntu 22.04+ / Debian 12+ / RHEL 9+。
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # musl 静态链接版：不挑发行版和 glibc 版本，Alpine 上也能跑。
          #
          # 依赖里带 C 代码的那几个（ring、zstd-sys、bzip2-sys）在 musl 下能编过、产物
          # 纯静态能运行，rust:alpine 容器里实测过；Ubuntu runner 上靠 musl-tools 的
          # musl-gcc 接管 cc 这一环，v0.4.0 发版时真跑通了（Release 页上有这个包）。
          # 所以不再标 optional：编不过就是发版失败，不能悄悄少一个包。
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ring（TLS 的底层）带 C 代码，编 musl 目标要有 musl-gcc。
      - name: 安装 musl 工具链
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 构建和打包都在 scripts/package.sh 里，本地跑的是同一份。
      # 打包逻辑分成两份的话，本地打出来的包和 Release 页上的包会慢慢分家，
      # 而两边都"看起来正常"。
      # 只有打 tag 时才把 tag 名当版本传进去（脚本会核对它和 Cargo.toml 一致）。手动空跑
      # 时 GITHUB_REF_NAME 是分支名 main，传进去会被当成"版本对不上"拒掉。
      - name: 构建并打包
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then export VERSION="$GITHUB_REF_NAME"; fi
          scripts/package.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: 建 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 这个 job 只收构件、不编译，但仍要 checkout：下面生成校验和用的是
      # 仓库里的 scripts/package.sh（和 build job 那份是同一个）。
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 校验和让下载的人能自己确认文件没被换过。同样走 scripts/package.sh，
      # 本地打完包也能用同一条命令生成。
      - name: 生成校验和
        run: scripts/package.sh --checksums

      # 用 gh CLI 而不是第三方 action：它是 runner 自带的，少一层供应链依赖。
      #
      # 有 docs/releases/<tag>.md 就用它当发布说明。这个仓库直接往 main 提交、不走 PR，
      # 自动生成的说明只有一行 Full Changelog（v0.4.0 就是这样），升级要注意什么一个字
      # 都没有。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "gld ${GITHUB_REF_NAME}" \
            "${notes_args[@]}"
