[package]
name = "gld"
description = "gld — command line front-end for the workspace-first MCP / GPT Actions runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "gld"
path = "src/lib.rs"

[[bin]]
name = "gld"
path = "src/main.rs"

[dependencies]
gld-core = { workspace = true }
gld-daemon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
clap_complete = "4"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
# 只用来把 SIGPIPE 恢复成系统默认，见 main.rs。
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# OAuth 集成测试要自己算 PKCE 的 S256 challenge，版本跟 core 保持一致，
# 不会给 Cargo.lock 添新条目。
base64 = "0.22"
sha2 = "0.10"
# 原生节点集成测试的隔离 TLS 入口，版本沿用 core 的锁定依赖。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# 节点超大回包测试要一张真能解码的大 PNG；core 已带进同一版本，不新增下载。
image = { version = "0.25", default-features = false, features = ["png"] }
