[package]
name = "gld-runtime"
description = "Workspace file and command execution with explicit policy and storage inputs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
gld-policy = { workspace = true }
gld-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
fs2 = { workspace = true }
uuid = { workspace = true }
toexec-fs = { workspace = true }
toexec-text = { workspace = true }
walkdir = "2"
regex = "1"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
which = "7"
shell-words = "1"

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
