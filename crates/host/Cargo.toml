[package]
name = "gld-host"
description = "Host-side listeners, gateway, authentication and execution-generation routing for GLD"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
gld-core = { workspace = true }
gld-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
axum = { version = "0.8", features = ["form", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
base64 = "0.22"
jsonwebtoken = "9"
sha2 = "0.10"
tokio-tungstenite = { version = "=0.29.0", default-features = false }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
