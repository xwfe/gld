[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xwfe/gld"
rust-version = "1.85"

[workspace.dependencies]
gld-core = { path = "crates/core" }
gld-daemon = { path = "crates/daemon" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "process", "io-util", "fs", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
fs2 = "0.4"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
