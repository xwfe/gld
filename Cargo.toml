[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xwfe/gld"
# 1.85 提到 1.89：三个仓库（gld / ccnm / toexec）统一 rust-version，
# 时点就是第一个共享 crate 被产品链接的这一刻。下限来自 ccnm 的 File::try_lock。
rust-version = "1.89"

[workspace.dependencies]
gld-core = { path = "crates/core" }
gld-daemon = { path = "crates/daemon" }
# 跟 ccnm 共用的文本读取原语（跨仓计划 toexec 的 V2-K）。
#
# 按 tag 固定，不跟着 main 走：共享库改了不会在某次 `cargo update` 之后突然
# 改变这里的行为。升级是一次显式的改动——在那边发新 tag，再改这一行。用
# https 而不是 ssh，是因为 toexec 是公开仓库，匿名就能读，本地和 CI 都不
# 需要配凭据。本地开发那边的源码时临时改成 path 依赖，**别提交**。
toexec-text = { git = "https://github.com/xwfe/toexec.git", tag = "toexec-text-v0.1.0" }
# 同一个仓库的第二个 crate：原子文件替换。tag 各自独立，升级一个不会
# 顺带把另一个也换掉。
toexec-fs = { git = "https://github.com/xwfe/toexec.git", tag = "toexec-fs-v0.2.1" }
# 第三个：SKILL.md 的 frontmatter。gld 原来自己逐行找 `key:` 前缀，
# `description: >` 这种多行写法读出来是一个 `>`。
toexec-skill = { git = "https://github.com/xwfe/toexec.git", tag = "toexec-skill-v0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "process", "io-util", "fs", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
fs2 = "0.4"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
