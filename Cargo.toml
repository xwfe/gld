[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xwfe/gld"
# 1.85 提到 1.89：三个仓库（gld / ccnm / workspace-kernel）统一 rust-version，
# 时点就是第一个共享 crate 被产品链接的这一刻。下限来自 ccnm 的 File::try_lock。
rust-version = "1.89"

[workspace.dependencies]
gld-core = { path = "crates/core" }
gld-daemon = { path = "crates/daemon" }
# 跟 ccnm 共用的文本读取原语（跨仓计划 workspace-kernel 的 V2-K）。
#
# **这是本地路径依赖，所以 GitHub Actions 上构建不了**：runner 只 checkout
# 这一个仓库，找不到 ../workspace-kernel。用户 2026-09-16 决定先这样，不把
# 那个仓库推成远端。要让 CI 重新变绿，二选一：把 workspace-kernel 推成远端
# 仓库、这里改成 { git = ..., tag = ... }；或者撤回这次链接。
wk-text = { path = "../workspace-kernel/crates/wk-text" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "process", "io-util", "fs", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
fs2 = "0.4"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
